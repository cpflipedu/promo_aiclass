<!DOCTYPE html>

    <style>
        /* 基本樣式重置 */
        body {
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            background-color: transparent; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 390px;
        }

        .container {
            width: 690px;
            height: 350px; 
            display: flex;
            flex-direction: row;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* 左側圖片區：確保正方形圖片完整 */
        .content-left {
            flex: 1; 
            background-color: #004da0; /* 配合圖片深藍底色，消除縫隙感 */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 確保 1:1 圖片完整顯示，不被切掉 */
            display: block;
        }

        /* 右側文字區 */
        .content-right {
            flex: 1.1;
            padding: 25px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .sub-title {
            color: #718096;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        h2 {
            margin: 0 0 12px 0;
            font-size: 20px;
            line-height: 1.4;
            color: #1a202c;
            font-weight: 800;
        }

        p {
            color: #4a5568;
            line-height: 1.6;
            margin: 0 0 15px 0;
            font-size: 14px;
        }

        .promo-text {
            color: #2d3748;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 15px;
            border-left: 3px solid #ff6b00;
            padding-left: 10px;
        }

        /* 按鈕樣式：顏色更鮮明 */
        .cta-container {
            margin-top: 5px;
        }

        .cta-link {
            display: inline-block;
            width: 100%;
            /* 鮮明暖色漸層 */
            background: linear-gradient(90deg, #ff8e3c 0%, #ff6b00 50%, #ff4e00 100%) !important;
            color: #ffffff !important;
            text-decoration: none !important;
            padding: 14px 0;
            border-radius: 50px;
            font-weight: bold;
            font-size: 17px;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }

        .cta-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 0, 0.4);
        }

        a {
            text-decoration: none;
        }

<body>
